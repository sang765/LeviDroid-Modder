name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Validate release content
        run: python3 scripts/validate_release_content.py

      - name: Prepare google-services.json
        run: |
          set -euo pipefail

          # The fork ships without a Firebase project: google-services.json is a
          # CI-only stub so the build and the signing pipeline never depend on secrets.
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Verify installed SDK Packages
        run: sdkmanager --list

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Build Debug, Beta and Unsigned Release APKs
        run: ./gradlew assembleDebug assembleBeta assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: LeviLauncher-Modder-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload R8 mappings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LeviLauncher-r8-mappings-${{ github.sha }}
          path: |
            app/build/outputs/mapping/debug/
            app/build/outputs/mapping/beta/
            app/build/outputs/mapping/release/
          if-no-files-found: error

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v7
        with:
          name: LeviLauncher-Modder-release-unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk

      - name: Upload Beta APK
        uses: actions/upload-artifact@v7
        with:
          name: LeviLauncher-Modder-beta-apk
          path: app/build/outputs/apk/beta/*.apk

      - name: Sign Release APKs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY_STORE }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG=${GITHUB_REF_NAME}
          BT="$ANDROID_HOME/build-tools/35.0.0"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/levi.p12"

          # universal goes first: older in-app updaters grab the first .apk
          # asset, which must stay installable on every ABI
          for ABI in universal arm64-v8a armeabi-v7a; do
            SRC="app/build/outputs/apk/release/app-${ABI}-release-unsigned.apk"
            DST="LeviLauncher-Modder-${TAG}-${ABI}-release.apk"
            cp "$SRC" "$DST"
            "$BT/zipalign" -f -p 4 "$DST" "$DST.aligned"
            mv "$DST.aligned" "$DST"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/levi.p12" --ks-type pkcs12 \
              --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD \
              --key-pass env:KEY_PASSWORD "$DST"
            "$BT/apksigner" verify "$DST"
            echo "Signed $DST"
          done

          rm -f "$RUNNER_TEMP/levi.p12"

      - name: Upload Signed APK Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: LeviLauncher-Modder-${{ github.ref_name }}-release-apks
          path: LeviLauncher-Modder-${{ github.ref_name }}-*-release.apk

      - name: Release APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LeviLauncher-Modder-${{ github.ref_name }}-universal-release.apk
            LeviLauncher-Modder-${{ github.ref_name }}-arm64-v8a-release.apk
            LeviLauncher-Modder-${{ github.ref_name }}-armeabi-v7a-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          APK_URL: "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LeviLauncher-Modder-${{ github.ref_name }}-universal-release.apk"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK is not set; skipping notification."
            exit 0
          fi

          EMBED_TITLE="🚀 LeviLauncher Modder Update!"
          EMBED_DESC="A new version of **LeviLauncher Modder** is ready."
          EMBED_COLOR=5814783
          THUMB_URL='https://avatars.githubusercontent.com/u/78095377?s=200&v=4'

          curl -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"$EMBED_TITLE\",
              \"description\": \"$EMBED_DESC\",
              \"color\": $EMBED_COLOR,
              \"thumbnail\": { \"url\": \"$THUMB_URL\" },
              \"fields\": [
                {
                  \"name\": \"📦 Version\",
                  \"value\": \"\`$TAG_NAME\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"🔗 Download\",
                  \"value\": \"[**Click here to download APK**]($APK_URL)\",
                  \"inline\": true
                }
              ]
            }]
          }" \
          "$DISCORD_WEBHOOK"
