name: Sync main with upstream

on:
  push:
    branches: [ dev ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/LiteLDev/LeviLaunchroid.git
          git fetch upstream main
          git fetch origin main

      - name: Merge upstream/main into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --no-edit upstream/main

      - name: Push main if updated
        run: |
          if git diff --quiet origin/main main; then
            echo "main is already up to date with upstream/main"
          else
            git push origin main
          fi
