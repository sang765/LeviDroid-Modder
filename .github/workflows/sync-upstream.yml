name: Sync upstream into dev

on:
  push:
    branches: [ dev ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      UPSTREAM_REPO: LiteLDev/LeviLaunchroid
      SYNC_BRANCH: sync/upstream-main
      SYNC_TITLE: "chore: sync upstream/main into dev"
      # The step below adds an "upstream" remote; without this, gh would resolve
      # the repository from it and try to open the PR on LiteLDev/LeviLaunchroid,
      # where the token has no access.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: dev

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch upstream main
          git fetch origin dev

      - name: Check for new upstream commits
        id: check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE=$(git merge-base origin/dev upstream/main)
          COUNT=$(git rev-list --count "${BASE}"..upstream/main)
          echo "base=${BASE}" >> "${GITHUB_OUTPUT}"
          echo "count=${COUNT}" >> "${GITHUB_OUTPUT}"
          if [ "${COUNT}" -eq 0 ]; then
            echo "dev already contains upstream/main, nothing to sync"
          else
            echo "upstream/main is ${COUNT} commit(s) ahead of dev:"
            git log --oneline "${BASE}"..upstream/main
          fi

      # Probe the merge on a throwaway branch so the working tree stays usable.
      - name: Probe merge for conflicts
        id: probe
        if: steps.check.outputs.count != '0'
        run: |
          git checkout -B sync-probe origin/dev
          if git merge --no-commit --no-ff upstream/main > /tmp/merge.log 2>&1; then
            echo "conflict=false" >> "${GITHUB_OUTPUT}"
            git merge --abort
          else
            echo "conflict=true" >> "${GITHUB_OUTPUT}"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            echo "conflicted files:"
            cat /tmp/conflicts.txt
            git merge --abort
          fi

      - name: Open sync pull request
        if: steps.check.outputs.count != '0' && steps.probe.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -B "${SYNC_BRANCH}" origin/dev
          git merge --no-edit upstream/main
          # GITHUB_TOKEN cannot push changes under .github/workflows, and the fork's
          # workflows are maintained on dev — keep ours during the sync.
          git checkout origin/dev -- .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream/main, keeping fork workflows"
          fi
          git push -f origin "${SYNC_BRANCH}"
          if [ "$(gh pr list --base dev --head "${SYNC_BRANCH}" --state open --json number --jq 'length')" != "0" ]; then
            echo "sync PR is already open"
            exit 0
          fi
          BODY=$(cat <<'EOF'
          Automated sync of `upstream/main` into `dev`.

          - Upstream head: https://github.com/LiteLDev/LeviLaunchroid/commits/main
          - Conflicts: none, this is a clean merge.

          > [!NOTE]
          > PRs opened with the default `GITHUB_TOKEN` do not start CI by themselves.
          > Merge it and the `dev` push builds the APK, or re-run the workflow manually.
          > Upstream changes under `.github/workflows` are intentionally dropped — the
          > fork keeps its own workflows.
          EOF
          )
          gh pr create --base dev --head "${SYNC_BRANCH}" --title "${SYNC_TITLE}" --body "${BODY}"

      - name: Open conflict issue
        if: steps.check.outputs.count != '0' && steps.probe.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Upstream sync blocked: conflicts between upstream/main and dev"
          if [ "$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq 'length')" != "0" ]; then
            echo "conflict issue is already open"
            exit 0
          fi
          BASE="${{ steps.check.outputs.base }}"
          {
            echo "## Upstream sync is blocked"
            echo
            echo "\`upstream/main\` has new commits that do not merge cleanly into \`dev\`."
            echo
            echo "- New commits: \`${{ steps.check.outputs.count }}\`"
            echo "- Upstream: https://github.com/${UPSTREAM_REPO}/commits/main"
            echo
            echo "### New upstream commits"
            echo '```'
            git log --oneline "${BASE}"..upstream/main
            echo '```'
            echo
            echo "### Conflicted files"
            echo '```'
            cat /tmp/conflicts.txt
            echo '```'
            echo
            echo "### How to resolve"
            echo '```'
            echo "git fetch upstream main"
            echo "git checkout dev && git pull"
            echo "git merge upstream/main   # resolve the conflicts listed above"
            echo "git push origin dev"
            echo '```'
            echo
            echo "> [!NOTE]"
            echo "> Once the conflicts are resolved and the merge is pushed to \`dev\`,"
            echo "> close this issue as **completed**."
          } > /tmp/issue.md
          gh issue create --title "${TITLE}" --body-file /tmp/issue.md

      # Runs on every dev push so the sync PR / conflict issue shows up right on the
      # Actions run page instead of having to look for it.
      - name: Report sync result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr list --base dev --head "${SYNC_BRANCH}" --state open --json url --jq '.[0].url // empty' || true)
          PR_TITLE=$(gh pr list --base dev --head "${SYNC_BRANCH}" --state open --json title --jq '.[0].title // empty' || true)
          ISSUE_URL=$(gh issue list --state open --search 'in:title "Upstream sync blocked"' --json url --jq '.[0].url // empty' || true)
          ISSUE_TITLE=$(gh issue list --state open --search 'in:title "Upstream sync blocked"' --json title --jq '.[0].title // empty' || true)

          COUNT="${{ steps.check.outputs.count }}"
          CONFLICT="${{ steps.probe.outputs.conflict }}"
          if [ -z "${COUNT}" ]; then
            OUTCOME="sync did not run"
          elif [ "${COUNT}" = "0" ]; then
            OUTCOME="dev already contains upstream/main"
          elif [ "${CONFLICT}" = "true" ]; then
            OUTCOME="conflict issue opened"
          else
            OUTCOME="sync pull request opened"
          fi

          echo "outcome: ${OUTCOME}"
          echo "sync PR:   ${PR_URL:-none}"
          echo "sync issue: ${ISSUE_URL:-none}"
          {
            echo "## Upstream sync"
            echo
            echo "- Outcome: **${OUTCOME}**"
            echo "- Sync PR: ${PR_URL:-none}${PR_TITLE:+ — ${PR_TITLE}}"
            echo "- Conflict issue: ${ISSUE_URL:-none}${ISSUE_TITLE:+ — ${ISSUE_TITLE}}"
          } >> "${GITHUB_STEP_SUMMARY}"
